<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Bestest Friend 💎🧿</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at center,#3a064d 0%,#160020 45%,#050008 100%);
    color:white;
}

/* ---------- BACKGROUND ---------- */

.stars{
    position:fixed;
    inset:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.5);}
    to{opacity:1;transform:scale(1.5);}
}

/* ---------- MAIN ---------- */

.main{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.box{
    animation:opening 2s ease forwards;
}

@keyframes opening{
    0%{
        opacity:0;
        transform:scale(.5);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

.intro{
    font-size:14px;
    letter-spacing:6px;
    color:#ffd6f0;
    margin-bottom:25px;
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{text-shadow:0 0 5px #ff69b4;}
    to{text-shadow:0 0 25px #ff69b4;}
}

h1{
    font-size:clamp(42px,11vw,100px);
    font-weight:900;
    line-height:.95;
    letter-spacing:3px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #ff9ed5,
        #ffffff,
        #d98cff,
        #ffffff
    );

    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;

    animation:
        shine 4s linear infinite,
        glow 2s infinite alternate;
}

@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 5px #ff69b4);
    }
    to{
        filter:drop-shadow(0 0 35px #ff69b4);
    }
}

.subtitle{
    margin-top:25px;
    font-size:21px;
    color:#ffe7f5;
    letter-spacing:2px;
}

.line{
    width:180px;
    height:2px;
    margin:25px auto;
    background:linear-gradient(
        90deg,
        transparent,
        #ff69b4,
        transparent
    );
    box-shadow:0 0 15px #ff69b4;
}

/* ---------- BUTTON ---------- */

button{
    margin-top:20px;
    padding:16px 35px;
    border:none;
    border-radius:50px;

    color:white;
    font-size:17px;
    font-weight:bold;

    background:linear-gradient(
        90deg,
        #ff3f9f,
        #b94dff
    );

    box-shadow:
        0 0 15px #ff3f9f,
        0 0 35px rgba(255,63,159,.5);

    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 25px #ff3f9f,
        0 0 60px #ff3f9f;
}

/* ---------- FLOATING HEARTS ---------- */

.heart{
    position:fixed;
    bottom:-30px;
    z-index:3;
    font-size:22px;
    pointer-events:none;
    animation:float 7s linear forwards;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* ---------- CONFETTI ---------- */

.confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:15px;
    z-index:8;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* ---------- FIREWORK ---------- */

.firework{
    position:fixed;
    width:5px;
    height:5px;
    border-radius:50%;
    z-index:4;

    animation:explode 1.3s ease-out forwards;
}

@keyframes explode{
    0%{
        box-shadow:0 0 5px white;
        opacity:1;
    }

    100%{
        opacity:0;
        box-shadow:
        0 -110px #ff69b4,
        70px -70px #ffd700,
        110px 0 #8fffff,
        70px 70px #ff69b4,
        0 110px #ffd700,
        -70px 70px #8fffff,
        -110px 0 #ff69b4,
        -70px -70px #ffd700;
    }
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){

    .intro{
        font-size:11px;
        letter-spacing:4px;
    }

    .subtitle{
        font-size:17px;
    }

    button{
        font-size:15px;
        padding:14px 28px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="main">

    <div class="box">

        <div class="intro">
            ✨ SOMETHING SPECIAL IS WAITING FOR YOU ✨
        </div>

        <h1>
            BEST<br>
            FRIEND 💎🧿🫂
        </h1>

        <div class="line"></div>

        <div class="subtitle">
            The Birthday GIRL🤌😚 
        </div>

        <button onclick="startSurprise()">
            💎 BEGIN THE SURPRISE 💎
        </button>

    </div>

</div>

<script>

/* ---------- STARS ---------- */

const stars = document.getElementById("stars");

for(let i=0;i<120;i++){

    let star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*3+"s";

    stars.appendChild(star);
}


/* ---------- HEARTS ---------- */

function heart(){

    let h=document.createElement("div");

    h.className="heart";

    const emojis=[
        "💖","💕","💗","💓",
        "💞","❤️","🩷","✨"
    ];

    h.innerHTML=
        emojis[Math.floor(Math.random()*emojis.length)];

    h.style.left=
        Math.random()*100+"vw";

    h.style.animationDuration=
        (5+Math.random()*4)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
        h.remove();
    },9000);
}

setInterval(heart,450);


/* ---------- CONFETTI ---------- */

function confetti(){

    let c=document.createElement("div");

    c.className="confetti";

    c.style.left=
        Math.random()*100+"vw";

    c.style.background=
        ["#ff69b4","#ffd700","#b66cff","#ffffff","#61e7ff"]
        [Math.floor(Math.random()*5)];

    c.style.animationDuration=
        (3+Math.random()*3)+"s";

    document.body.appendChild(c);

    setTimeout(()=>{
        c.remove();
    },6000);
}


/* ---------- FIREWORKS ---------- */

function firework(){

    let f=document.createElement("div");

    f.className="firework";

    f.style.left=
        (10+Math.random()*80)+"vw";

    f.style.top=
        (10+Math.random()*55)+"vh";

    document.body.appendChild(f);

    setTimeout(()=>{
        f.remove();
    },1400);
}


/* ---------- GRAND OPENING ---------- */

function startSurprise(){

    /* Explosion of confetti */

    for(let i=0;i<120;i++){

        setTimeout(()=>{
            confetti();
        },i*15);

    }

    /* Fireworks */

    for(let i=0;i<25;i++){

        setTimeout(()=>{
            firework();
        },i*120);

    }

    /* Go to Page 2 */

    setTimeout(()=>{

        window.location.href="p2.html";

    },4500);
}

</script>

</body>
</html>
