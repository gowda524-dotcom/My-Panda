<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 44: The Grand Finale</title>
    
    <style>
        /* --- General Setup & Theme --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif; 
            background: radial-gradient(circle, #5e0279 0%, #1e003a 100%); 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            min-height: 100vh;
            color: white;
            text-align: center;
            position: relative; 
            overflow: hidden; 
        }

        /* --- Music Autoplay Trigger (Hidden) --- */
        #music-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; 
            cursor: pointer;
            background: rgba(0,0,0,0); 
        }

        /* --- Header Text --- */
        #main-header-container {
            position: relative;
            z-index: 100; 
            margin-top: 30px;
            margin-bottom: 20px;
            color: #FFC0CB; 
            text-shadow: 0 0 15px #FFD700, 0 0 30px #FFC0CB;
            padding: 0 15px;
        }

        #main-header-container strong {
            font-size: 2.8em; 
            font-weight: 900;
            display: block;
        }
        
        #main-header-container p {
            font-size: 2em; 
            font-weight: 500;
            margin-top: 5px;
        }

        /* --- Image Slideshow Container --- */
        #slideshow-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            /* Set background to black to hide potential image edges better */
            background-color: #000000; 
        }
        
        .slide-image {
            width: 100%;
            height: 100%;
            /* Keep 'contain' to show the full image */
            object-fit: contain; 
            position: absolute;
            opacity: 0;
            /* Add a small filter to blur the image slightly, making the edges/blank space less jarring */
            filter: blur(0.5px); 
            transition: opacity 3s ease-in-out; 
        }
        
        .slide-image.active {
            opacity: 1;
        }

        /* --- Quiz Box (Starts hidden) --- */
        #quiz-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; 
            background: rgba(255, 20, 147, 0.95); 
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            display: none; 
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px #FFD700, 0 0 20px white;
            animation: fadeIn 0.5s forwards;
        }
        
        #quiz-question {
            font-size: 1.1em;
            font-weight: bold;
            color: #FFFF00;
            margin-bottom: 15px;
        }
        
        #quiz-answer {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
            font-size: 1em;
        }
        
        #quiz-submit {
            padding: 10px 25px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #00FF7F; 
            color: #1a003a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        /* --- Grand Effects CSS --- */
        .floating-emoji, .confetti-fall, .firework, .firework-particle {
            position: fixed; 
            z-index: 5; 
            pointer-events: none; 
        }
        
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 0; } 
            50% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
        
        .floating-emoji {
            font-size: 2.5em; 
            animation: float 10s linear infinite; 
        }
        
        @keyframes confetti-fall-slow {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .confetti-fall {
            animation: confetti-fall-slow 15s linear infinite;
        }
        
        .firework {
            position: absolute;
            width: 8px; height: 8px;
            background-color: #FFD700; 
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700, 0 0 20px #ff0;
            opacity: 0;
        }
    </style>
</head>
<body>
    <audio id="bgMusic" src="Page44.mp3" loop preload="auto"></audio>

    <div id="music-trigger"></div>

    <div id="slideshow-container">
        <img class="slide-image active" src="L1.jpg" alt="Final Photo 1">
        <img class="slide-image" src="L2.jpg" alt="Final Photo 2">
    </div>

    <div id="main-header-container">
        <strong>En Best Friend Eluthunathu🤗💎🫂</strong>
        <p>Memories 🥹</p>
    </div>

    <div id="quiz-box">
        <p id="quiz-question">
            Na unkooda spend panna Time Romba kammi Ahna maraka mudiyatha memories neraiya eruku...Thank you ❤️‍🩹
        </p>
        
        <form id="final-submit-form" action="page45.html" method="GET">
            <input type="text" id="quiz-answer" name="finalAnswer" placeholder="Type your answer or a thank you here..." required>
            <button type="submit" id="quiz-submit">
                Submit & Continue ➡️
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const music = document.getElementById('bgMusic');
            const musicTrigger = document.getElementById('music-trigger');
            const quizBox = document.getElementById('quiz-box');
            const slides = document.querySelectorAll('.slide-image');
            const finalSubmitForm = document.getElementById('final-submit-form');
            
            let musicStarted = false;
            let effectIntervals = []; 
            let currentSlide = 0;
            let fireworkInterval;

            // --- 1. Music Autoplay and Effects Start ---
            const startContent = () => {
                if (!musicStarted) {
                    music.volume = 0.6; 
                    music.play().then(() => {
                        musicStarted = true;
                        musicTrigger.style.display = 'none'; 
                    }).catch(e => {
                        console.error("Music playback failed:", e);
                    });
                }
                startGrandEffects();
            };

            // Force play on first touch/click
            musicTrigger.addEventListener('click', startContent, { once: true }); 

            // Attempt to autoplay quietly on load
            music.volume = 0; 
            music.play().then(startContent).catch(e => {});

            // --- 2. Slideshow Logic ---
            function nextSlide() {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
            const slideshowInterval = setInterval(nextSlide, 8000);

            // --- 3. Delayed Quiz Appearance ---
            setTimeout(() => {
                quizBox.style.display = 'flex';
                clearInterval(fireworkInterval); 
            }, 20000); 

            // --- 4. Grand Effects Functions (omitted for brevity) ---
            const confettiColors = ['#FF69B4', '#FFD700', '#FFFFFF', '#00FF7F', '#4CAF50', '#8A2BE2', '#FF1493'];
            const floatingEmojis = ['💖', '💕', '🥰', '😍', '✨', '🌟', '🎉', '🎈', '❤️', '😘', '👑', '🎂', '🥳', '🤩', '🫶', '🤗', '😚', '💙', '🫂', '🎊']; 
            
            function createFloatingEmoji() { 
                const emoji = document.createElement('span');
                emoji.classList.add('floating-emoji');
                emoji.textContent = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
                body.appendChild(emoji);
                const size = Math.random() * 1.5 + 1.5;
                emoji.style.fontSize = `${size}em`;
                emoji.style.left = `${Math.random() * 100}vw`;
                emoji.style.animationDuration = `${Math.random() * 8 + 10}s`;
                emoji.style.animationDelay = `${Math.random() * 5}s`;
                setTimeout(() => emoji.remove(), 20000);
            }

            function createConfettiPiece() { 
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-fall');
                body.appendChild(confetti);

                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.width = `${Math.random() * 8 + 4}px`; 
                confetti.style.height = `${Math.random() * 8 + 4}px`;
                confetti.style.borderRadius = `${Math.random() > 0.5 ? '50%' : '0'}`; 
                
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = `-10vh`; 
                confetti.style.animationDuration = `${Math.random() * 10 + 15}s`; 
                confetti.style.animationDelay = `${Math.random() * 5}s`;
                
                setTimeout(() => confetti.remove(), 25000); 
            }

            function createFirework() { 
                const firework = document.createElement('div');
                firework.classList.add('firework');
                body.appendChild(firework);

                const startLeft = Math.random() * 100;
                firework.style.left = `${startLeft}vw`;
                firework.style.bottom = `-10px`; 

                const endHeight = Math.random() * 60 + 20; 
                firework.style.transition = `transform ${Math.random() * 0.8 + 0.7}s ease-in, opacity 0.5s ease-out 0.8s`;
                firework.style.transform = `translateY(-${endHeight}vh)`;
                firework.style.opacity = 1;

                setTimeout(() => {
                    const particleCount = Math.floor(Math.random() * 15) + 15; 
                    for (let i = 0; i < particleCount; i++) {
                        const particle = document.createElement('div');
                        particle.classList.add('firework-particle');
                        particle.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                        particle.style.width = `${Math.random() * 5 + 2}px`;
                        particle.style.height = particle.style.width;
                        particle.style.borderRadius = '50%';
                        particle.style.position = 'absolute';
                        particle.style.opacity = 1; 

                        const angle = Math.random() * 2 * Math.PI;
                        const distance = Math.random() * 80 + 50; 
                        
                        particle.style.left = `50%`;
                        particle.style.top = `50%`;

                        firework.appendChild(particle);

                        setTimeout(() => {
                            particle.style.transition = `transform 1s ease-out, opacity 1s ease-out`;
                            particle.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.5)`;
                            particle.style.opacity = 0;
                        }, 50); 
                        
                        setTimeout(() => particle.remove(), 1200);
                    }
                    
                    firework.remove();
                }, (Math.random() * 0.8 + 0.7) * 1000);
            }

            function startGrandEffects() {
                effectIntervals.push(setInterval(createFloatingEmoji, 300));
                effectIntervals.push(setInterval(createConfettiPiece, 200));
                fireworkInterval = setInterval(createFirework, 1000); 
            }

            // --- 5. Form Submission ---
            finalSubmitForm.addEventListener('submit', (e) => {
                if (music) music.pause();
            });

        });
    </script>
</body>
</html>
