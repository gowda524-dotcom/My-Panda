<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Little Wish For Mom 💕</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia,serif;
    color:white;

    background:
        radial-gradient(
            circle at 50% 35%,
            #74394e 0%,
            #351827 35%,
            #12070d 75%,
            #050205 100%
        );
}

/* Cinematic background */

.backgroundGlow{
    position:fixed;
    width:70vw;
    height:70vw;
    max-width:700px;
    max-height:700px;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);

    background:rgba(255,190,205,.14);
    border-radius:50%;
    filter:blur(90px);

    animation:breath 5s ease-in-out infinite alternate;
}

@keyframes breath{
    from{
        opacity:.35;
        transform:translate(-50%,-50%) scale(.9);
    }
    to{
        opacity:.7;
        transform:translate(-50%,-50%) scale(1.1);
    }
}

/* Stars */

.star{
    position:fixed;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 9px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.5);}
    to{opacity:1;transform:scale(1.5);}
}

/* Main */

.page{
    position:relative;
    z-index:5;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.content{
    width:min(92%,850px);
    text-align:center;

    animation:enter 2s ease;
}

@keyframes enter{
    from{
        opacity:0;
        transform:scale(.8) translateY(50px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

/* Heading */

.label{
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:5px;
    color:#ffe0e8;
    margin-bottom:15px;
}

h1{
    font-size:clamp(30px,7vw,60px);
    line-height:1.1;
    margin-bottom:25px;

    color:#fff1f5;

    text-shadow:
        0 0 8px #ff9bb8,
        0 0 25px rgba(255,120,160,.7);
}

/* Photo */

.photo-frame{
    position:relative;
    width:min(70vw,300px);
    height:min(70vw,300px);

    margin:0 auto 25px;

    border-radius:50%;
    padding:8px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ffc2d3,
            #d98ba5,
            #fff
        );

    box-shadow:
        0 0 20px rgba(255,190,210,.8),
        0 0 60px rgba(255,100,150,.45);

    animation:
        photoFloat 4s ease-in-out infinite,
        photoGlow 2s infinite alternate;
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}

@keyframes photoFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-9px);
    }
}

@keyframes photoGlow{
    from{
        box-shadow:
            0 0 20px rgba(255,190,210,.6),
            0 0 35px rgba(255,100,150,.3);
    }
    to{
        box-shadow:
            0 0 30px rgba(255,220,230,1),
            0 0 75px rgba(255,100,150,.7);
    }
}

/* Decorative halo */

.halo{
    position:absolute;
    inset:-18px;
    border:1px solid rgba(255,220,230,.4);
    border-radius:50%;
    animation:rotate 12s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

/* Message */

.message{
    width:min(90%,650px);
    margin:auto;

    font-size:clamp(16px,4vw,21px);
    line-height:1.8;

    color:#fff1f5;
    min-height:150px;

    text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.cursor{
    color:#ffadc4;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

/* Continue */

button{
    margin-top:15px;

    padding:14px 30px;
    border:none;
    border-radius:50px;

    color:white;
    background:
        linear-gradient(
            90deg,
            #d95778,
            #a84f78
        );

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(255,110,150,.6);

    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

/* Floating petals */

.petal{
    position:fixed;
    top:-30px;
    z-index:3;
    pointer-events:none;

    font-size:18px;

    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:
            translateY(-20px)
            rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.9;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(100px)
            rotate(500deg);
        opacity:0;
    }
}

/* Music button */

.music{
    position:fixed;
    right:18px;
    top:18px;
    z-index:20;

    width:48px;
    height:48px;

    border-radius:50%;
    border:1px solid rgba(255,255,255,.4);

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);

    color:white;
    font-size:20px;

    cursor:pointer;
}
</style>
</head>

<body>

<div class="backgroundGlow"></div>

<button class="music" onclick="toggleMusic()" id="musicBtn">
    🎵
</button>

<audio id="music" loop>
    <source src="pa4.mp3" type="audio/mpeg">
</audio>

<div class="page">

    <div class="content">

        <div class="label">
            💕 A LITTLE HEART HAS SOMETHING TO SAY 💕
        </div>

        <h1>
            your little boy Wish<br>
            For you🥹
        </h1>

        <div class="photo-frame">

            <div class="halo"></div>

            <img
                src="baby.jpg"
                alt="Baby"
            >

        </div>

        <div class="message">
            <span id="typing"></span>
            <span class="cursor">|</span>
        </div>

        <button onclick="nextPage()">
            💖 Continue the Story
        </button>

    </div>

</div>

<script>

/* Stars */

for(let i=0;i<90;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*3+"s";

    document.body.appendChild(star);
}


/* Message */

const message =
"Amma🌍... 💕\n\n" +
"Lov uuu Amma😚,\n" +
"but you are already my whole world. 🥹\n\n" +
"Thank you for every hug,\n" +
"every smile, every lullaby,\n" +
"and every moment you spend with me. 🌸\n\n" +
"Happy Birthday, Amma! 🎂😚🧿\n" +
"Your little one loves you forever. ♾️";

const typing=document.getElementById("typing");

let index=0;

function type(){

    if(index < message.length){

        typing.innerHTML =
            message
            .substring(0,index+1)
            .replace(/\n/g,"<br>");

        index++;

        setTimeout(type,45);
    }
}

setTimeout(type,1000);


/* Falling petals */

function createPetal(){

    const petal=document.createElement("div");

    petal.className="petal";

    const items=[
        "🌸",
        "🌷",
        "✨",
        "💕",
        "🤍"
    ];

    petal.innerHTML=
        items[Math.floor(Math.random()*items.length)];

    petal.style.left=
        Math.random()*100+"vw";

    petal.style.animationDuration=
        (5+Math.random()*5)+"s";

    document.body.appendChild(petal);

    setTimeout(()=>{
        petal.remove();
    },11000);
}

setInterval(createPetal,500);


/* Music */

const music=document.getElementById("music");
const musicBtn=document.getElementById("musicBtn");

function toggleMusic(){

    if(music.paused){

        music.volume=.45;

        music.play();

        musicBtn.innerHTML="🔊";

    }else{

        music.pause();

        musicBtn.innerHTML="🎵";
    }
}


/* Start music after user interaction */

document.addEventListener("click",function startMusic(){

    music.volume=.45;

    music.play().catch(()=>{});

    musicBtn.innerHTML="🔊";

    document.removeEventListener("click",startMusic);

},{once:true});


/* Page 5 */

function nextPage(){

    document.body.style.transition="1.2s";
    document.body.style.opacity="0";

    setTimeout(()=>{

        window.location.href="frnd5.html";

    },1200);
}

</script>

</body>
</html>
